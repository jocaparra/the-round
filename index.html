<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Round</title>
<meta name="description" content="The Round: cobertura de startups de alto crescimento e venture capital no Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,340;0,9..144,560;0,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --ink: #16160f;
    --muted: #726d5e;
    --accent: #1e4d3b;
    --rule: #dedad0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    text-align: center;
    overflow-x: hidden;
  }

  main.stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.9rem, 2.4vw, 1.6rem);
    padding: 0 clamp(1.25rem, 7vw, 6rem);
    max-width: 56rem;
  }

  h1.mark {
    margin: 0;
    display: inline-flex;
    align-items: baseline;
    font-weight: 560;
    font-size: clamp(2.3rem, 15vw, 9.5rem);
    line-height: 0.92;
    letter-spacing: -0.02em;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(0.4em);
    animation: rise 1000ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  span.dot {
    width: 0.16em;
    height: 0.16em;
    margin-left: 0.1em;
    border-radius: 50%;
    background: var(--accent);
    align-self: flex-end;
    transform: translateY(-0.16em);
    flex: none;
  }

  p.tagline {
    margin: 0;
    max-width: 30ch;
    font-weight: 340;
    font-style: italic;
    font-size: clamp(1rem, 1.9vw, 1.2rem);
    line-height: 1.5;
    letter-spacing: 0.005em;
    color: var(--muted);
    opacity: 0;
    animation: settle 900ms ease-out 480ms forwards;
  }

  span.cursor {
    display: inline-block;
    width: 0.09em;
    height: 1em;
    margin-left: 0.12em;
    vertical-align: -0.14em;
    background: var(--accent);
    opacity: 0;
    animation:
      settle 1ms ease-out 1380ms forwards,
      blink 1.15s steps(1) 1400ms infinite;
  }

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(1.25rem, 4vh, 2.5rem);
    text-align: center;
    opacity: 0;
    animation: settle 900ms ease-out 820ms forwards;
  }

  footer a {
    font-family: "Fraunces", Georgia, serif;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 0.1em;
    transition: color 220ms ease, border-color 220ms ease;
  }

  footer a:hover,
  footer a:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
  }

  a:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 3px;
    border-radius: 1px;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes settle {
    to { opacity: 1; }
  }

  @keyframes blink {
    0%, 44% { opacity: 1; }
    45%, 100% { opacity: 0; }
  }

  @media (max-width: 420px) {
    span.dot { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1.mark, p.tagline, footer, span.cursor {
      animation: none;
      opacity: 1;
      transform: none;
    }
    span.cursor { opacity: 0.85; }
  }
</style>
</head>
<body>

<main class="stage">
  <h1 class="mark">THE ROUND<span class="dot" aria-hidden="true"></span></h1>
  <p class="tagline">Crescimento acelerado, capital de risco e startups antes da consolidação.<span class="cursor" aria-hidden="true"></span></p>
</main>

<footer>
  <a href="mailto:oi@theround.com.br">oi@theround.com.br</a>
</footer>

</body>
</html>
